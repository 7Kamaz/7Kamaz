name: Update THM Badge
 
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-badge:
    # Mudamos para 22.04 para evitar o erro de sandbox do Ubuntu 24.04
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Screenshot THM Badge
        # Usando a versão correta da Action com suporte a no-sandbox
        uses: flameddd/screenshots-ci-action@master
        with:
          url: https://tryhackme.com/api/v2/badges/public-profile?userPublicId=5230186
          output: assets/thm-dynamic-badge.png
          width: 330
          height: 90
          no_sandbox: true
          wait_for: 8000 # 8 segundos para garantir o carregamento completo

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thm-dynamic-badge.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update THM Dynamic Badge" && git push)