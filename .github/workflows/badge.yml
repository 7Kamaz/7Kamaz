name: Update THM Badge

on:
schedule:
- cron: '0 */12 * * *' # Roda a cada 12 horas
workflow_dispatch: # Permite rodar manualmente para testar

jobs:
update-badge:
runs-on: ubuntu-latest
permissions:
contents: write
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Download Badge
run: |
mkdir -p assets
curl -L "https://tryhackme.com/api/v2/badges/public-profile?userPublicId=5230186" -o assets/thm-dynamic-badge.png

- name: Commit and Push
run: |
git config --global user.name "github-actions[bot]"
git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add assets/thm-dynamic-badge.png
git diff --quiet && git diff --staged --quiet || (git commit -m "Update THM Dynamic Badge" && git push)
